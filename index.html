<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seu Nome | Links</title>
  <meta name="description" content="Todos os meus links em um só lugar.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" aria-label="Alternar tema">🌓</button>

  <main class="container">
    <header class="profile">
      <img id="avatar" class="avatar" alt="Foto de perfil">
      <h1 id="name"></h1>
      <p id="bio"></p>
      <div id="socials" class="socials"></div>
    </header>

    <nav id="links" class="links" aria-label="Links"></nav>

    <footer class="footer">
      <span id="year"></span> · Feito com ♥
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
